<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>吴迪 · 超越维度 | 个人极客主页</title>
    <!-- 预连接 & 字体加速 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 现代字体 + 优雅图标库 (轻量) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 提升视觉高级感，不影响复制邮箱按钮 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            cursor: default;
            backdrop-filter: blur(0px);
        }

        /* ---------- 动态粒子背景 Canvas ---------- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.6s ease;
        }

        /* 主卡片容器 - 玻璃幻彩 + 悬浮3D感 */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 580px;
            margin: 2rem auto;
            background: rgba(12, 20, 35, 0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 4rem 2rem 4rem 2rem;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1) inset, 0 0 30px rgba(0, 255, 255, 0.2);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.4s ease;
            animation: cardFloat 6s infinite ease-in-out;
        }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(0, 255, 255, 0.5) inset, 0 0 40px rgba(0, 255, 255, 0.4);
            border-color: rgba(0, 255, 255, 0.6);
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* 内容区域 */
        .card-inner {
            padding: 2.2rem 2rem 2.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6rem;
        }

        /* 头像区域 - 光环呼吸 + 悬停光晕 */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 0.5rem;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(0, 255, 255, 0.7);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            background: #0a1428;
        }

        .avatar:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.8), 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: #0ff;
        }

        /* 动态旋转光晕环 */
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #0ff, #f0f, #0ff);
            opacity: 0.5;
            z-index: -1;
            animation: spinGlow 8s linear infinite;
            filter: blur(8px);
        }

        @keyframes spinGlow {
            100% { transform: rotate(360deg); }
        }

        /* 姓名 + 霓虹签名 */
        .name {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #FFFFFF, #4dffff, #a0f0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            margin-bottom: 0.2rem;
        }

        .badge {
            font-size: 0.8rem;
            background: rgba(0, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            padding: 0.25rem 1rem;
            border-radius: 40px;
            color: #9effff;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            display: inline-block;
        }

        /* 信息网格 */
        .info-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .info-item {
            background: rgba(10, 20, 35, 0.5);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 0.9rem 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            transition: all 0.25s ease;
            cursor: default;
        }

        .info-item:hover {
            background: rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.6);
            transform: translateX(6px);
            box-shadow: -4px 4px 12px rgba(0,0,0,0.2);
        }

        .info-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #ccf4ff;
            font-size: 1.1rem;
        }

        .info-label i {
            width: 28px;
            font-size: 1.4rem;
            color: #0ff;
            text-shadow: 0 0 5px cyan;
        }

        .info-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #f0f9ff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 2px rgba(0,0,0,0.2);
        }

        .age-number {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(145deg, #ffd966, #ffaa33);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
            margin-right: 4px;
        }

        /* 特殊邮箱复制区 */
        .email-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .copy-btn {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #0ff;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #0ff;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: #0ff;
            color: #0a0f1e;
            box-shadow: 0 0 12px cyan;
            transform: scale(1.02);
        }

        /* 倒计时 & 额外炫技 */
        .countdown-wrap {
            margin-top: 1rem;
            width: 100%;
            background: rgba(0, 20, 40, 0.5);
            border-radius: 2rem;
            padding: 0.7rem 1rem;
            text-align: center;
            border: 1px dashed rgba(0, 255, 255, 0.4);
            font-size: 0.9rem;
            font-weight: 500;
            color: #b0e0ff;
        }

        .countdown-wrap span {
            color: #ffd966;
            font-weight: 800;
            font-size: 1rem;
        }

        /* 社交/联系方式微交互 */
        .social-tip {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: #88bbdd;
        }

        .social-tip i {
            margin-right: 5px;
            color: #0ff;
        }

        /* 响应式细腻调整 */
        @media (max-width: 550px) {
            .card-inner {
                padding: 1.6rem 1.4rem 2rem;
            }
            .name {
                font-size: 2.4rem;
            }
            .avatar {
                width: 120px;
                height: 120px;
            }
            .info-item {
                padding: 0.7rem 1rem;
            }
            .info-label i {
                font-size: 1.2rem;
            }
            .info-value {
                font-size: 1rem;
            }
            .age-number {
                font-size: 1.3rem;
            }
        }

        /* 加载动画 */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card {
            animation: fadeSlideUp 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.1), cardFloat 6s infinite ease-in-out;
            animation-delay: 0s, 0.9s;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #03050b;
        }
        ::-webkit-scrollbar-thumb {
            background: #0ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Canvas 粒子背景（顶级丝滑粒子流） -->
    <canvas id="particle-canvas"></canvas>

    <!-- 主卡片：吴迪个人介绍宇宙中心 -->
    <div class="glass-card">
        <div class="card-inner">
            <!-- 头像区域 动态光环 -->
            <div class="avatar-wrapper">
                <img class="avatar" src="app/1.png" alt="吴迪·无限可能" onerror="this.onerror=null; this.src='https://placehold.co/400x400/0a1428/0ff?text=WD';">
            </div>
            
            <!-- 姓名 + 酷炫徽章 -->
            <div style="text-align: center;">
                <h1 class="name">吴迪 · WUDI</h1>
                <div class="badge"><i class="fas fa-bolt" style="margin-right: 6px;"></i> 超越引力 · 极客型格</div>
            </div>

            <!-- 信息网格: 生日/年龄/身高/邮箱 -->
            <div class="info-grid">
                <!-- 生日条目 -->
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-cake-candles"></i>
                        <span>诞生之日</span>
                    </div>
                    <div class="info-value">2004.05.23 <span style="font-size:0.85rem; opacity:0.8;">✦ 金牛座</span></div>
                </div>
                
                <!-- 动态年龄 (核心) -->
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-chart-line"></i>
                        <span>巅峰年龄</span>
                    </div>
                    <div class="info-value">
                        <span class="age-number" id="dynamic-age">--</span> <span style="font-size:1rem;">岁 · 正值当打之年</span>
                    </div>
                </div>
                
                <!-- 身高 195cm 霸气 -->
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-ruler-combined"></i>
                        <span>制空高度</span>
                    </div>
                    <div class="info-value">195 cm <span style="font-size:0.8rem; margin-left:8px;">🚀 巨人视野</span></div>
                </div>
                
                <!-- 联系方式 邮箱 + 复制超能力 -->
                <div class="info-item">
                    <div class="info-label">
                        <i class="fas fa-envelope"></i>
                        <span>星链联络</span>
                    </div>
                    <div class="info-value email-group">
                        <span id="email-text" style="font-family: monospace; letter-spacing: 0.5px;">2658521367@qq.com</span>
                        <button class="copy-btn" id="copyEmailBtn"><i class="far fa-copy"></i> 复制</button>
                    </div>
                </div>
            </div>
            
            <!-- 动态倒计时：距离下一个生日还有XX天 炫酷彩蛋 -->
            <div class="countdown-wrap" id="birthday-countdown">
                <i class="fas fa-hourglass-half" style="margin-right: 8px; color:#0ff;"></i> 
                距下次破界升级 · 还剩 <span id="countdown-days">--</span> 天
            </div>
            
            <!-- 低调而高级的社交/联系暗号 -->
            <div class="social-tip">
                <span><i class="fab fa-github-alt"></i> wudi.space</span>
                <span><i class="fas fa-globe"></i> transcend.zone</span>
                <span><i class="fas fa-basketball-ball"></i> 195·控场</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========================
            // 1. 动态年龄核心函数 (基于生日 2004年05月23日)
            // ========================
            const BIRTHDAY = new Date(2004, 4, 23); // 月份 4 = 五月
            function calculateAge() {
                const today = new Date();
                let age = today.getFullYear() - BIRTHDAY.getFullYear();
                const monthDiff = today.getMonth() - BIRTHDAY.getMonth();
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < BIRTHDAY.getDate())) {
                    age--;
                }
                return age;
            }

            // 更新年龄显示
            function updateAgeUI() {
                const ageSpan = document.getElementById('dynamic-age');
                if (ageSpan) {
                    const currentAge = calculateAge();
                    ageSpan.innerText = currentAge;
                    // 添加微小的数字闪动效果(丝滑)
                    ageSpan.style.transform = 'scale(1.08)';
                    setTimeout(() => { if(ageSpan) ageSpan.style.transform = ''; }, 200);
                }
            }

            // ========================
            // 2. 距离下个生日的倒计时 (炫技+加强动态感)
            // ========================
            function getNextBirthdayCountdown() {
                const today = new Date();
                let nextBirthday = new Date(today.getFullYear(), 4, 23); // 今年生日
                if (today > nextBirthday) {
                    nextBirthday = new Date(today.getFullYear() + 1, 4, 23);
                }
                const diffTime = nextBirthday - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? diffDays : 0;
            }

            function updateCountdownUI() {
                const countSpan = document.getElementById('countdown-days');
                if (countSpan) {
                    const daysLeft = getNextBirthdayCountdown();
                    countSpan.innerText = daysLeft;
                    // 额外特效: 当不足7天显示火焰icon变化
                    const countdownWrap = document.getElementById('birthday-countdown');
                    if (daysLeft <= 7 && daysLeft > 0) {
                        countdownWrap.style.border = '1px solid #ffaa44';
                        countdownWrap.style.boxShadow = '0 0 12px rgba(255,170,68,0.3)';
                    } else {
                        countdownWrap.style.border = '1px dashed rgba(0, 255, 255, 0.4)';
                        countdownWrap.style.boxShadow = 'none';
                    }
                }
            }

            // ========================
            // 3. 邮箱复制 + 优雅提示(轻提示toast)
            // ========================
            function showToast(message, isSuccess = true) {
                // 动态创建轻提示toast (高级自定义)
                const toast = document.createElement('div');
                toast.innerText = message;
                toast.style.position = 'fixed';
                toast.style.bottom = '30px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                toast.style.backgroundColor = isSuccess ? 'rgba(0, 255, 200, 0.9)' : 'rgba(255, 80, 80, 0.9)';
                toast.style.color = '#03050b';
                toast.style.padding = '10px 24px';
                toast.style.borderRadius = '60px';
                toast.style.fontWeight = '600';
                toast.style.fontSize = '0.9rem';
                toast.style.backdropFilter = 'blur(12px)';
                toast.style.zIndex = '9999';
                toast.style.fontFamily = "'Inter', sans-serif";
                toast.style.boxShadow = '0 8px 20px rgba(0,0,0,0.3)';
                toast.style.border = '1px solid rgba(255,255,255,0.3)';
                toast.style.transition = 'all 0.25s ease';
                toast.style.opacity = '0';
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '1'; toast.style.transform = 'translateX(-50%) translateY(0px)'; }, 10);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(20px)';
                    setTimeout(() => { toast.remove(); }, 300);
                }, 2200);
            }

            function setupEmailCopy() {
                const copyBtn = document.getElementById('copyEmailBtn');
                const emailSpan = document.getElementById('email-text');
                if (copyBtn && emailSpan) {
                    copyBtn.addEventListener('click', async () => {
                        const email = emailSpan.innerText.trim();
                        try {
                            await navigator.clipboard.writeText(email);
                            showToast(`✨ 邮箱 ${email} 已复制，期待联络 ✨`, true);
                            // 按钮动画反馈
                            copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
                            setTimeout(() => {
                                copyBtn.innerHTML = '<i class="far fa-copy"></i> 复制';
                            }, 1500);
                        } catch (err) {
                            showToast('⚠️ 手动复制一下吧，超人也会累', false);
                        }
                    });
                }
            }

            // ========================
            // 4. 粒子系统背景 (极致丝滑Canvas 高性能)
            // ========================
            class ParticleNetwork {
                constructor(canvas) {
                    this.canvas = canvas;
                    this.ctx = canvas.getContext('2d');
                    this.particles = [];
                    this.particleCount = 110;   // 数量适中，保持超流畅
                    this.maxDistance = 130;
                    this.mouse = { x: null, y: null, radius: 180 };
                    this.init();
                    this.animate();
                    window.addEventListener('resize', () => this.resizeCanvas());
                    this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                    this.canvas.addEventListener('mouseleave', () => this.onMouseLeave());
                }
                
                init() {
                    this.resizeCanvas();
                    this.createParticles();
                }
                
                resizeCanvas() {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                    this.createParticles();
                }
                
                createParticles() {
                    this.particles = [];
                    for (let i = 0; i < this.particleCount; i++) {
                        this.particles.push({
                            x: Math.random() * this.canvas.width,
                            y: Math.random() * this.canvas.height,
                            vx: (Math.random() - 0.5) * 0.5,
                            vy: (Math.random() - 0.5) * 0.5,
                            size: Math.random() * 2.5 + 1.2,
                            color: `rgba(80, 200, 255, ${Math.random() * 0.5 + 0.2})`
                        });
                    }
                }
                
                onMouseMove(e) {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouse.x = e.clientX - rect.left;
                    this.mouse.y = e.clientY - rect.top;
                }
                
                onMouseLeave() {
                    this.mouse.x = null;
                    this.mouse.y = null;
                }
                
                drawParticles() {
                    if (!this.ctx) return;
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    // 绘制连接线
                    for (let i = 0; i < this.particles.length; i++) {
                        const p1 = this.particles[i];
                        for (let j = i + 1; j < this.particles.length; j++) {
                            const p2 = this.particles[j];
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < this.maxDistance) {
                                const opacity = (1 - distance / this.maxDistance) * 0.5;
                                this.ctx.beginPath();
                                this.ctx.strokeStyle = `rgba(0, 200, 255, ${opacity * 0.8})`;
                                this.ctx.lineWidth = 0.8;
                                this.ctx.moveTo(p1.x, p1.y);
                                this.ctx.lineTo(p2.x, p2.y);
                                this.ctx.stroke();
                            }
                        }
                    }
                    // 绘制粒子 + 鼠标影响光晕
                    for (let p of this.particles) {
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = p.color;
                        this.ctx.fill();
                        // 加内发光效果
                        this.ctx.shadowBlur = 6;
                        this.ctx.shadowColor = '#0ff';
                        this.ctx.fill();
                        this.ctx.shadowBlur = 0;
                        
                        // 鼠标排斥/吸引效果 (超动态)
                        if (this.mouse.x && this.mouse.y) {
                            const dxMouse = p.x - this.mouse.x;
                            const dyMouse = p.y - this.mouse.y;
                            const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                            if (distMouse < this.mouse.radius) {
                                const force = (1 - distMouse / this.mouse.radius) * 0.8;
                                const angle = Math.atan2(dyMouse, dxMouse);
                                p.vx += Math.cos(angle) * force * 0.2;
                                p.vy += Math.sin(angle) * force * 0.2;
                            }
                        }
                    }
                }
                
                updateParticles() {
                    for (let p of this.particles) {
                        p.x += p.vx;
                        p.y += p.vy;
                        // 边界反弹柔和
                        if (p.x < 0) { p.x = 0; p.vx *= -0.98; }
                        if (p.x > this.canvas.width) { p.x = this.canvas.width; p.vx *= -0.98; }
                        if (p.y < 0) { p.y = 0; p.vy *= -0.98; }
                        if (p.y > this.canvas.height) { p.y = this.canvas.height; p.vy *= -0.98; }
                        // 速度阻尼 保持优雅
                        p.vx *= 0.995;
                        p.vy *= 0.995;
                        // 限制最大速度
                        const maxSpeed = 1.5;
                        if (Math.abs(p.vx) > maxSpeed) p.vx = p.vx > 0 ? maxSpeed : -maxSpeed;
                        if (Math.abs(p.vy) > maxSpeed) p.vy = p.vy > 0 ? maxSpeed : -maxSpeed;
                    }
                }
                
                animate() {
                    this.updateParticles();
                    this.drawParticles();
                    requestAnimationFrame(() => this.animate());
                }
            }
            
            // 初始化粒子系统
            const canvasElem = document.getElementById('particle-canvas');
            if (canvasElem) {
                new ParticleNetwork(canvasElem);
            }
            
            // ========================
            // 5. 首次渲染所有动态数据 + 保证年龄每年动态（其实函数每次调用动态）
            // ========================
            function initDynamicContent() {
                updateAgeUI();
                updateCountdownUI();
                setupEmailCopy();
                
                // 可选: 每隔一小时刷新一次倒计时/年龄(为了跨天更新显示，极客精神)
                setInterval(() => {
                    updateAgeUI();
                    updateCountdownUI();
                }, 3600000); // 每小时刷新一次，保持精确
            }
            
            // 监听页面加载完成
            window.addEventListener('DOMContentLoaded', () => {
                initDynamicContent();
                // 额外优雅控制: 如果图片加载错误，增加视觉占位符文本
                const img = document.querySelector('.avatar');
                if (img && img.complete && (img.naturalWidth === 0 || img.naturalHeight === 0)) {
                    img.src = 'https://placehold.co/400x400/0a1428/0ff?text=WU+DI';
                }
            });
            
            // 窗口resize额外保证canvas 粒子自适应 (已包含在粒子类中)
        })();
    </script>
</body>
</html>
